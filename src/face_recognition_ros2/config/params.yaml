# -----------------------------------------------------------------------------
# face_recognition_ros2 — parameter defaults / reference.
#
# ROS2 syntax: parameters live under <node_name>: ros__parameters:. (The ROS1
# package next door must NOT use that level — ROS1 has no such concept.)
#
# NOTE: neither launch file loads this file; they pass every parameter
# explicitly (launch/face_recognition.launch.py, launch/usb_cam_face.launch.py,
# both AUTHORITATIVE). Use this file when running the node by hand:
#
#     ros2 run face_recognition_ros2 face_recognition_node \
#         --ros-args --params-file <this file>
#
# Only parameters the node actually declares may be listed here: an undeclared
# one makes the node refuse to start. Keep the values in sync with the launch
# defaults.
# -----------------------------------------------------------------------------
face_recognition_node:
  ros__parameters:
    image_topic: "/image_raw"
    result_topic: "/face/recognition_result"
    confidence_threshold: 0.5
    db_path: "/data/hhqs_data/face_db/faces.db"
    faces_dir: "/data/hhqs_data/face_db/faces"
    # Relative to the working directory, matching the node's own defaults. The
    # launch files resolve these to absolute paths under <repo>/models.
    detection_model: "models/det_10g.onnx"
    recognition_model: "models/w600k_r50.onnx"
